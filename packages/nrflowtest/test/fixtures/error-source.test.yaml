version: 1
cases:
  - name: identical messages split by nested concrete sources
    timeout: 80
    inject:
      node: outer
      msg: {payload: {left: [{text: 'shared <&'}], right: [{text: 'shared <&'}]}}
    expectError:
      - {node: {name: Nested instance}, source: outer-middle-left, message: 'shared <&'}
      - {node: outer, source: outer-middle-right, message: 'shared <&'}
      - {node: outer, source: outer-middle-left, message: 'shared <&', count: 0}
      - {node: outer, message: 'shared <&', count: 0}
  - name: literal filters and positive counts across instances
    timeout: 80
    inject:
      - node: outer
        msg: {payload: {left: [{text: 'shared <&', copies: 2}], right: [{text: 'shared <&'}]}}
      - node: other
        after: 20
        msg: {payload: {left: [{text: 'shared <&'}]}}
    expectError:
      - {node: outer, source: left, message: shared, count: 0}
      - {node: outer, source: Left source, message: shared, count: 0}
      - {node: outer, source: middle-left, message: shared, count: 0}
      - {node: outer, source: OUTER-middle-left, message: shared, count: 0}
      - {node: outer, source: other-middle-left, message: shared, count: 0}
      - {node: outer, source: outer-middle-right, message: SHARED, count: 0}
      - {node: outer, source: outer-middle-right, message: shared}
      - {node: outer, source: outer-middle-left, message: shared, count: 2}
      - {node: other, source: other-middle-left, message: shared}
  - name: concrete direct node and omitted filter
    timeout: 80
    inject: {node: plain, msg: {payload: {left: [{text: 'shared <&', copies: 2}]}}}
    expectError:
      - {node: plain, source: outer-middle-left, message: shared, count: 0}
      - {node: plain, source: plain, message: shared, count: 2}
      - {node: plain, message: shared, count: 0}
  - name: source scoped truncated nonmatches retain independent fidelity
    timeout: 80
    inject: {node: outer, msg: {payload: {left: [{}], right: [{text: 'shared <&'}]}}}
    expectError:
      - {node: outer, source: outer-middle-left, message: TAIL, count: 0}
      - {node: outer, source: outer-middle-right, message: shared}
      - {node: outer, source: outer-middle-left, message: x}
