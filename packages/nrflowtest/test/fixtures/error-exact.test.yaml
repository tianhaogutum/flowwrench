version: 1
cases:
  - name: direct exact and substring literal messages
    timeout: 80
    inject:
      node: plain
      msg:
        payload:
          left:
            - text: short
            - text: short tail
            - text: pre short
            - text: SHORT
            - text: |-
                line
                雪🙂 <&
            - text: é
            - text: é
            - text: .*
          right: []
    expectError:
      - node: plain
        message: Short
        messageMatch: exact
        count: 0
      - node: plain
        message: short
        messageMatch: exact
      - node: plain
        message: |-
          line
          雪🙂 <&
        messageMatch: exact
      - node: plain
        message: é
        messageMatch: exact
      - node: plain
        message: é
        messageMatch: exact
      - node: plain
        message: .*
        messageMatch: exact
      - node: plain
        message: SHORT
        messageMatch: exact
      - node: plain
        message: short
        messageMatch: substring
        count: 2
      - node: plain
        message: short
        messageMatch: exact
        count: 0
      - node: plain
        message: short
        count: 0
  - name: nested instances and source filters preserve exact counts
    timeout: 80
    inject:
      - node: outer
        msg:
          payload:
            left:
              - text: shared <&
                copies: 2
              - text: shared <& tail
            right:
              - text: shared <&
      - node: other
        msg:
          payload:
            left:
              - text: shared <&
            right: []
        after: 20
    expectError:
      - node: outer
        message: shared <&
        messageMatch: exact
        source: outer-middle-right
      - node: outer
        message: shared <&
        messageMatch: exact
        source: outer-middle-left
        count: 2
      - node: outer
        message: shared <&
        messageMatch: exact
        count: 0
      - node: outer
        source: outer-middle-left
        message: shared <&
      - node: other
        message: shared <&
        messageMatch: exact
        source: other-middle-left
  - name: retained exact equality does not establish original message equality
    timeout: 80
    inject:
      node: outer
      msg:
        payload:
          left:
            - {}
          right:
            - text: short
    expectError:
      - node: outer
        message: 
        messageMatch: exact
        source: outer-middle-left
        count: 0
      - node: outer
        message: 
        messageMatch: exact
        source: outer-middle-left
      - node: outer
        message: short
        messageMatch: exact
        source: outer-middle-right
      - node: outer
        message: 
        messageMatch: exact
        count: 0
      - node: outer
        message: 
        messageMatch: exact
        count: 0
  - name: exact retained zero with no errors
    timeout: 20
    expectError:
      - node: plain
        message: short
        messageMatch: exact
        count: 0
