version: 1
cases:
  - name: intentional order port pointer and count failures
    timeout: 80
    inject:
      - node: router
        msg: {payload: {id: A, accepted: true}}
      - node: router
        msg: {payload: {id: B, accepted: true}}
      - node: router
        msg: {payload: {id: C, accepted: false}}
    expect:
      - node: router
        event: output
        sequence:
          - output: 0
            fields: {'/payload/id': 'B<&'}
          - output: 1
            fields: {'/payload/id': A}
          - output: 1
            fields: {'/payload/missing': null}
          - output: 0
            fields: {'/payload/id': D}
