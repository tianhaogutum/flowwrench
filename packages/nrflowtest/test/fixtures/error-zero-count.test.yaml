version: 1
cases:
  - name: no retained errors
    timeout: 40
    expectError:
      - {node: plain, message: absent, count: 0}
      - {node: outer, message: absent, count: 0}
  - name: retained nonmatches are consumed only by later matching declarations
    timeout: 80
    inject: {node: plain, msg: {payload: {specs: [{unit: 'short <&', repeat: 1}, {unit: x, repeat: 8000, suffix: TAIL}]}}}
    expectError:
      - {node: plain, message: TAIL, count: 0}
      - {node: plain, message: SHORT, count: 0}
      - {node: plain, message: 'short <&'}
      - {node: plain, message: x}
      - {node: plain, message: x, count: 0}
    expect: [{node: sink, count: 2}]
  - name: nested instance zero after passing consumers
    timeout: 80
    inject: {node: outer, msg: {payload: {specs: [{unit: 'alpha shared', repeat: 1}, {unit: 'beta shared', repeat: 1}]}}}
    expectError:
      - {node: {name: Nested instance}, message: beta}
      - {node: outer, message: beta, count: 0}
      - {node: outer, message: alpha}
      - {node: outer, message: shared, count: 0}
    expect: [{node: sink, count: 2}]
