version: 1
cases:
  - name: failed exact zero consumes only equality matches
    timeout: 80
    inject:
      node: outer
      msg:
        payload:
          left:
            - text: short
              copies: 2
            - text: short tail
          right:
            - text: short
    expectError:
      - node: outer
        message: short
        messageMatch: exact
        source: outer-middle-left
        count: 0
      - node: outer
        message: short
        messageMatch: exact
        source: outer-middle-left
      - node: outer
        source: outer-middle-left
        message: short
      - node: outer
        message: short tail
        messageMatch: exact
        source: outer-middle-left
        count: 0
      - node: outer
        message: short
        messageMatch: exact
        source: outer-middle-right
  - name: exact nonmatch stays unexpected before message timeout
    timeout: 40
    inject:
      node: plain
      msg:
        payload:
          left:
            - text: short tail
          right: []
    expectError:
      - node: plain
        message: short
        messageMatch: exact
        count: 0
    expect:
      - node: sink
        msg:
          payload: wrong
        count: 99
  - name: prefix and suffix are exact nonmatches
    timeout: 40
    inject:
      node: plain
      msg:
        payload:
          left:
            - text: short tail
            - text: pre short
          right: []
    expectError:
      - node: plain
        message: short
        messageMatch: exact
      - node: plain
        message: short
        count: 2
  - name: retained equality can pass with incomplete entries and truncated messages
    timeout: 40
    inject:
      node: plain
      msg:
        payload:
          left:
            - copies: 101
          right: []
    expectError:
      - node: plain
        message: 
        messageMatch: exact
        count: 100
  - name: healthy exact case continues after failures
    timeout: 40
    inject:
      node: plain
      msg:
        payload:
          left:
            - text: |-
                line
                雪🙂 <&
          right: []
    expectError:
      - node: plain
        message: |-
          line
          雪🙂 <&
        messageMatch: exact
