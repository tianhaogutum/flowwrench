name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      # Some Python suites (windmill-dryrun) shell out to `node`.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      # openapi2piece type-checks generated pieces; without these pinned packages those tests skip.
      - name: Install pinned TypeScript toolchain for openapi2piece
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          mkdir -p "$RUNNER_TEMP/ts" && cd "$RUNNER_TEMP/ts"
          npm init -y >/dev/null
          npm install --no-audit --no-fund typescript@5.9.3 @activepieces/pieces-framework@0.32.0 \
            @activepieces/pieces-common@0.12.5 axios@1.20.0 @types/node@22.19.0
          echo "OPENAPI2PIECE_NODE_MODULES=$RUNNER_TEMP/ts/node_modules" >> "$GITHUB_ENV"
      - name: Run tests
        run: uv run --extra test pytest -q
      - name: Build wheel and sdist
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: uv build

  nrflowtest:
    name: nrflowtest (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nrflowtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/nrflowtest/npm-shrinkwrap.json
      - name: Install and test
        run: npm ci && npm test
